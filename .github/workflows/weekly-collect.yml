name: Weekly Air Freight Collect

on:
  schedule:
    # Sunday 00:30 UTC (~06:00 IST)
    - cron: "30 0 * * 0"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional run id from Power Automate / n8n"
        required: false
        default: ""
      mode:
        description: "collect mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - freightos
          - proxies

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: air-freight-rate-collector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: air-freight-rate-collector/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=all; fi
          case "$MODE" in
            freightos) PYTHONPATH=. python -m src.run_collect --freightos ;;
            proxies) PYTHONPATH=. python -m src.run_collect --proxies ;;
            *) PYTHONPATH=. python -m src.run_collect --all ;;
          esac
          PYTHONPATH=. python -m src.forecast_proxy_baseline || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: air-freight-processed-${{ github.run_id }}
          path: |
            air-freight-rate-collector/data/processed/*.csv
            air-freight-rate-collector/data/processed/*.json
            air-freight-rate-collector/artifacts/*

      - name: Optional SharePoint upload
        working-directory: air-freight-rate-collector
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FOLDER: incoming
          RUN_ID: ${{ github.event.inputs.run_id || github.run_id }}
        run: |
          if [ -z "${SHAREPOINT_CLIENT_ID:-}" ]; then
            echo "SharePoint upload skipped (secrets not configured)"
            exit 0
          fi
          PYTHONPATH=. python scripts/upload_to_sharepoint.py

      - name: Optional Fabric pipeline trigger
        env:
          FABRIC_TRIGGER_URL: ${{ secrets.FABRIC_TRIGGER_URL }}
          FABRIC_TOKEN: ${{ secrets.FABRIC_SPN_TOKEN }}
        run: |
          if [ -z "${FABRIC_TRIGGER_URL:-}" ]; then
            echo "Fabric pipeline trigger skipped (secrets not configured)"
            exit 0
          fi
          curl -sS -X POST "$FABRIC_TRIGGER_URL" \
            -H "Authorization: Bearer $FABRIC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'
